# SF1 class roster. Each base class promotes at level 10 (player typically
# waits until ~20 for stat-carryover advantage).
# weapon_types map to equipment.yaml entries; movement is the standard SF1
# value. Empty learn[] means spells are defined per-character (see characters.yaml).

# --- Max ---
- id: swordsman
  name: Swordsman
  promotes_to: hero
  promotion_level: 10
  movement: 6
  weapon_types: [sword]
  learn: []

- id: hero
  name: Hero
  promotes_to: null
  promotion_level: 10
  movement: 6
