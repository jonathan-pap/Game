# Shining Force 1 enemy roster, organized by chapter of first appearance.
# Stats are first-encounter values from RPGClassics & SFC; later-chapter
# variants of the same monster typically gain +2-4 HP / +3-5 ATK / +1-3 DEF.
# `chapter` lets future encounter generators scale appropriately.
