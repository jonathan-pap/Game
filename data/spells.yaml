# Spells. levels[] lets a single spell scale: e.g. Heal 1/2/3/4.
# range: target reachable tiles. area: AoE shape around the targeted tile.
# target: enemy | ally | self | tile.
- id: heal
  name: Heal
  school: light
  target: ally
  levels:
    - { mp: 3, range: 2, area: single, heal: 20 }
    - { mp: 5, range: 2, area: single, heal: 50 }
    - { mp: 8, range: 2, area: single, heal: 9999 } # full heal
    - { mp: 12, range: 2, area: cross_1, heal: 50 } # party heal

- id: detox
  name: Detox
  school: light
  target: ally
  levels:
    - { mp: 4, range: 2, area: single, cure: poison }

- id: aura
  name: Aura
  school: light
  target: ally
  levels:
    - { mp: 8, range: 0, area: cross_2, heal: 15 } # heals self+adjacent
    - { mp: 14, range: 0, area: cross_2, heal: 35 }

- id: blaze
